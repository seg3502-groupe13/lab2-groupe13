<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Convertisseur de température</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Calculatrice</h1>

<form th:action="@{/calculate}" method="get">
    <label for="first">Premier nombre :</label>
    <input id="first" name="first" th:value="${first}">

    <label for="second">Deuxième nombre :</label>
    <input id="second" name="second" th:value="${second}">

    <span class="operation">
        <label for="op">Opération :</label>
        <select id="op" name="operation">
            <option value="+">Addition (+)</option>
            <option value="-">Soustraction (-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
        </select>
    </span>

    <button type="submit">Calculer</button>
</form>

<p class="error" th:if="${error != null and !error.isEmpty()}"
   th:text="${error}"></p>
<p th:if="${result != null and !result.toString().isEmpty()}"
   th:text="|Résultat : ${result}|"></p>
</body>
</html>
